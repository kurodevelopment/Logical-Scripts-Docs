    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--page);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}button,input{font:inherit}button{color:inherit}

    .home-logo{display:flex;align-items:center;width:44px;height:44px;overflow:hidden;border-radius:7px;background:#050505}.home-logo img{width:100%;height:100%;object-fit:cover}.nav-spacer{flex:1}.nav-search{width:256px;height:34px;display:flex;align-items:center;gap:9px;padding:0 12px;border:0;border-radius:9px;background:color-mix(in srgb,var(--text) 5%,transparent);color:var(--muted);cursor:text;text-align:left;font-size:14px}.nav-search:hover{background:color-mix(in srgb,var(--text) 8%,transparent)}.nav-search svg{width:15px;height:15px;flex:none}.nav-search span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mobile-menu{display:none;border:0;background:transparent;padding:7px;margin-right:8px;cursor:pointer}.mobile-menu svg{width:22px;height:22px}
    .workspace{display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr) var(--right);min-height:calc(100vh - var(--header));transition:grid-template-columns .2s}.workspace.collapsed{--sidebar:0px}.workspace.collapsed .sidebar{transform:translateX(-100%)}

    .sidebar-footer{height:60px;display:flex;align-items:center;border-top:1px solid var(--line);padding:0 16px;flex:none}.theme-button,.collapse-button{display:flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--muted);font-size:14px;padding:8px;cursor:pointer;border-radius:6px}.theme-button:hover,.collapse-button:hover{color:var(--text);background:color-mix(in srgb,var(--text) 5%,transparent)}.collapse-button{margin-left:auto}.theme-button svg,.collapse-button svg{width:16px;height:16px}
    .center{min-width:0}.article{width:min(100%,788px);margin:0 auto;padding:21px 24px 80px}.article-head{margin-bottom:31px}.page-title{margin:0;font-size:36px;line-height:1.18;letter-spacing:-.03em;font-weight:750}.page-description{margin:6px 0 0;color:color-mix(in srgb,var(--accent-deep) 38%,var(--muted));font-size:20px;line-height:1.55}.content{color:var(--body)}.content h2{margin:31px 0 12px;padding-bottom:4px;border-bottom:1px solid var(--line);color:var(--text);font-size:30px;line-height:1.3;letter-spacing:-.025em}.content h3{margin:26px 0 8px;color:var(--text);font-size:21px;line-height:1.4;letter-spacing:-.012em}.content p{margin:12px 0 16px}.content strong{color:var(--text);font-weight:700}.content a{color:var(--accent-deep);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}.content a:hover{filter:brightness(.82)}.content ul,.content ol{margin:10px 0 18px;padding-left:24px}.content li{margin:4px 0}.content li::marker{color:var(--muted)}.content blockquote{margin:20px 0;padding:1px 0 1px 17px;border-left:3px solid var(--line);color:var(--muted)}.content hr{border:0;border-top:1px solid var(--line);margin:32px 0}
    .content code{padding:2px 6px;border-radius:5px;background:var(--code);color:var(--body);font:500 .875em ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}.codebox{position:relative;margin:20px 0 25px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--side)}.codebar{height:38px;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid var(--line);color:var(--faint);font:600 11px ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;letter-spacing:.07em}.copy-code{margin-left:auto;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:12px}.content pre{margin:0;padding:17px 18px;overflow:auto}.content pre code{padding:0;background:transparent;color:var(--body);font-size:13px;line-height:1.65}

    .rightbar{position:sticky;top:var(--header);height:calc(100vh - var(--header));padding:21px 24px 30px;overflow-y:auto}.toc-title{margin:0 0 17px;color:var(--text);font-size:14px;font-weight:700}.toc a{display:block;padding:3px 0;color:var(--muted);font-size:14px}.toc a:hover{color:var(--text)}.toc .sub{padding-left:12px}.feedback{margin-top:25px;padding-top:14px;border-top:1px solid var(--line)}.feedback a{display:block;margin:3px 0;color:var(--muted);font-size:13px}.feedback a:hover{color:var(--text)}
    .search-layer{position:fixed;inset:0;z-index:100;display:none;align-items:flex-start;justify-content:center;padding-top:12vh;background:rgba(15,17,20,.34);backdrop-filter:blur(3px)}.search-layer.open{display:flex}.search-panel{width:min(620px,calc(100vw - 32px));border:1px solid var(--line);border-radius:12px;background:var(--page);box-shadow:0 24px 80px rgba(0,0,0,.22);overflow:hidden}.search-field{height:55px;display:flex;align-items:center;gap:11px;padding:0 16px;border-bottom:1px solid var(--line)}.search-field svg{width:19px;color:var(--muted)}.search-field input{width:100%;border:0;outline:0;background:transparent;color:var(--text);font-size:16px}.search-results{max-height:420px;overflow:auto;padding:8px}.search-result{display:block;padding:10px 12px;border-radius:7px}.search-result:hover,.search-result.selected{background:var(--soft)}.search-result b{display:block;font-size:14px}.search-result span{display:block;color:var(--muted);font-size:12px}.search-empty{padding:25px;text-align:center;color:var(--muted);font-size:14px}.overlay{display:none}
    @media(max-width:1080px){:root{--right:0px}.rightbar{display:none}}
    @media(max-width:760px){.navbar{padding:0 15px}.mobile-menu{display:block}.home-logo{width:39px;height:39px}.nav-search{width:42px;padding:0;justify-content:center}.nav-search span{display:none}.workspace{display:block}.sidebar{position:fixed;z-index:45;left:0;top:var(--header);width:min(86vw,320px);transform:translateX(-100%);box-shadow:20px 0 45px rgba(0,0,0,.14)}.sidebar.open{transform:translateX(0)}.overlay{position:fixed;inset:var(--header) 0 0;z-index:40;background:rgba(0,0,0,.25)}.overlay.open{display:block}.collapse-button{display:none}.article{padding:23px 21px 65px}.page-title{font-size:32px}.page-description{font-size:17px}.content h2{font-size:25px}.cards{grid-template-columns:1fr}.pager{gap:10px}.pager a{font-size:14px}}
  </style>

  <script>
    const state={config:null,pages:[],meta:new Map()};
    const $=s=>document.querySelector(s);
    const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
    const slug=s=>s.toLowerCase().replace(/<[^>]+>/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
    const icons={'Logical Battlepass':'🎮','Logical Crafting':'🔨','Logic Shop':'🛒','Logic Squads':'👥'};
    function pageTitle(path){if(path==='index')return 'Logical Scripts Documentation';const acronyms={api:'API',faq:'FAQ',ui:'UI',sql:'SQL'};return path.split('/').pop().split('-').map(w=>acronyms[w]||w.charAt(0).toUpperCase()+w.slice(1)).join(' ')}
    function pageDescription(path){if(path==='index')return 'Logical Scripts Resources Document';if(path.endsWith('/overview'))return `Everything you need to know about ${path.split('/')[0].replace(/^./,c=>c.toUpperCase())}.`;return ''}
    function inline(s){return String(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>').replace(/\[([^\]]+)\]\(([^)]+)\)/g,(_,t,u)=>`<a href="${u.startsWith('/')?'#'+u.slice(1):u}"${u.startsWith('http')?' target="_blank" rel="noreferrer"':''}>${t}${u.startsWith('http')?' ↗':''}</a>`)}
    function components(src){return src.replace(/<CardGroup[^>]*>/g,'<div class="cards">').replace(/<\/CardGroup>/g,'</div>').replace(/<Card\s+title="([^"]+)"[^>]*href="([^"]+)"[^>]*>([\s\S]*?)<\/Card>/g,(_,t,h,b)=>`<a class="card" href="#${h.replace(/^\//,'')}"><h3>${t}</h3><p>${inline(b.trim())}</p></a>`).replace(/<Card\s+title="([^"]+)"[^>]*>([\s\S]*?)<\/Card>/g,(_,t,b)=>`<div class="card"><h3>${t}</h3><p>${inline(b.trim())}</p></div>`).replace(/<Steps>/g,'<div class="steps">').replace(/<\/Steps>/g,'</div>').replace(/<Step\s+title="([^"]+)"[^>]*>([\s\S]*?)<\/Step>/g,(_,t,b)=>`<div class="step"><h3>${t}</h3><p>${inline(b.trim())}</p></div>`).replace(/<Note>([\s\S]*?)<\/Note>/g,(_,b)=>`<div class="callout note"><span class="callout-icon">ⓘ</span><div>${inline(b.trim())}</div></div>`).replace(/<Tip>([\s\S]*?)<\/Tip>/g,(_,b)=>`<div class="callout tip"><span class="callout-icon">✓</span><div>${inline(b.trim())}</div></div>`).replace(/<Warning>([\s\S]*?)<\/Warning>/g,(_,b)=>`<div class="callout warning"><span class="callout-icon">!</span><div>${inline(b.trim())}</div></div>`).replace(/<AccordionGroup>/g,'<div class="accordion">').replace(/<\/AccordionGroup>/g,'</div>').replace(/<Accordion\s+title="([^"]+)"[^>]*>([\s\S]*?)<\/Accordion>/g,(_,t,b)=>`<details><summary>${t}</summary><div>${inline(b.trim())}</div></details>`).replace(/<Tabs>/g,'<div class="tabs">').replace(/<\/Tabs>/g,'</div>').replace(/<Tab\s+title="([^"]+)"[^>]*>([\s\S]*?)<\/Tab>/g,(_,t,b)=>`<div class="tab"><h3>${t}</h3><p>${inline(b.trim())}</p></div>`)}
    function markdown(src){src=components(src);const lines=src.split('\n');let out='',i=0,inCode=false,code=[],lang='',list=null;const closeList=()=>{if(list){out+=`</${list}>`;list=null}};while(i<lines.length){let line=lines[i];if(line.startsWith('```')){closeList();if(!inCode){inCode=true;lang=line.slice(3).trim();code=[]}else{out+=`<div class="codebox"><div class="codebar"><span>${esc(lang||'code')}</span><button class="copy-code">Copy</button></div><pre><code>${esc(code.join('\n'))}</code></pre></div>`;inCode=false}i++;continue}if(inCode){code.push(line);i++;continue}if(line.trim().startsWith('|')&&i+1<lines.length&&/^\s*\|?\s*[-:]+/.test(lines[i+1].replace(/\|/g,' | '))){closeList();const heads=line.split('|').filter(x=>x.trim()).map(x=>x.trim());i+=2;const rows=[];while(i<lines.length&&lines[i].trim().startsWith('|')){rows.push(lines[i].split('|').filter(x=>x.trim()).map(x=>x.trim()));i++}out+='<table><thead><tr>'+heads.map(x=>`<th>${inline(x)}</th>`).join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>`<td>${inline(x)}</td>`).join('')+'</tr>').join('')+'</tbody></table>';continue}if(/^###\s+/.test(line)){closeList();const t=line.replace(/^###\s+/,'');out+=`<h3 id="${slug(t)}">${inline(t)}</h3>`;i++;continue}if(/^##\s+/.test(line)){closeList();const t=line.replace(/^##\s+/,'');out+=`<h2 id="${slug(t)}">${inline(t)}</h2>`;i++;continue}if(/^#\s+/.test(line)){i++;continue}if(/^---+$/.test(line.trim())){closeList();out+='<hr>';i++;continue}let m=line.match(/^[-*]\s+(.+)/);if(m){if(list!=='ul'){closeList();list='ul';out+='<ul>'}out+=`<li>${inline(m[1])}</li>`;i++;continue}m=line.match(/^\d+\.\s+(.+)/);if(m){if(list!=='ol'){closeList();list='ol';out+='<ol>'}out+=`<li>${inline(m[1])}</li>`;i++;continue}m=line.match(/^>\s?(.+)/);if(m){closeList();out+=`<blockquote>${inline(m[1])}</blockquote>`;i++;continue}closeList();if(!line.trim()){i++;continue}if(line.trim().startsWith('<')){out+=line;i++;continue}let para=line.trim();while(i+1<lines.length&&lines[i+1].trim()&&!/^(#{1,3}\s|[-*]\s|\d+\.\s|```|<|\||>)/.test(lines[i+1]))para+=' '+lines[++i].trim();out+=`<p>${inline(para)}</p>`;i++}closeList();return out}
    function parseMdx(text){const fm=text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n/);let meta={title:'',description:''},body=text;if(fm){body=text.slice(fm[0].length);for(const line of fm[1].split(/\r?\n/)){const p=line.indexOf(':');if(p>0)meta[line.slice(0,p).trim()]=line.slice(p+1).trim().replace(/^"|"$/g,'')}}return{meta,body}}
    async function boot(){state.config=await fetch('docs.json').then(r=>r.json());for(const group of state.config.navigation.groups){for(const path of group.pages){try{const text=await fetch(path+'.mdx').then(r=>{if(!r.ok)throw Error();return r.text()});const {meta}=parseMdx(text);meta.title=meta.title||pageTitle(path);meta.description=meta.description||pageDescription(path);const page={path,group:group.group,...meta};state.meta.set(path,page);state.pages.push(page)}catch{}}}buildProducts();addEventListener('hashchange',loadPage);loadPage();applyTheme(localStorage.getItem('logical-theme')||'light')}
    function productGroups(){return state.config.navigation.groups.filter(g=>g.group!=='Getting Started')}
    function buildProducts(){const nav=$('#product-nav');nav.innerHTML='';for(const group of productGroups()){const box=document.createElement('section');box.className='product';box.dataset.group=group.group;box.innerHTML=`<button class="product-button" aria-expanded="false"><span class="emoji">${icons[group.group]||'◆'}</span><span>${esc(group.group)}</span><span class="chev">›</span></button><div class="product-pages">${group.pages.map(path=>{const p=state.meta.get(path);return `<a class="page-link" data-path="${path}" href="#${path}">${esc(p?.title||pageTitle(path))}</a>`}).join('')}</div>`;box.querySelector('button').onclick=()=>{box.classList.toggle('open');box.querySelector('button').setAttribute('aria-expanded',box.classList.contains('open'))};nav.appendChild(box)}}
    function cleanRoute(){return (location.hash.slice(1).split('::')[0]||'index').replace(/^\//,'')}
    function markActive(route){document.querySelectorAll('[data-path]').forEach(a=>a.classList.toggle('active',a.dataset.path===route));document.querySelectorAll('.product').forEach(box=>{const has=[...box.querySelectorAll('[data-path]')].some(a=>a.dataset.path===route);if(has)box.classList.add('open');box.querySelector('button')?.setAttribute('aria-expanded',box.classList.contains('open'))})}
    async function loadPage(){let route=cleanRoute();if(!state.meta.has(route))route='index';const p=state.meta.get(route);markActive(route);$('#title').textContent=p.title;$('#description').textContent=p.description||'';$('#description').style.display=p.description?'block':'none';document.title=`${p.title} | Logical Scripts`;$('#edit-link').href=`https://github.com/kurodevelopment/Logical-Scripts-Docs/blob/main/${route}.mdx`;try{const text=await fetch(route+'.mdx').then(r=>{if(!r.ok)throw Error();return r.text()});const {body}=parseMdx(text);$('#content').innerHTML=markdown(body);bindContent();buildToc();buildPager(route);window.scrollTo(0,0)}catch{$('#content').innerHTML='<p class="empty">This page could not be loaded.</p>'}closeMobile()}
    function bindContent(){$('#content').querySelectorAll('.copy-code').forEach(btn=>btn.onclick=async()=>{const code=btn.closest('.codebox').querySelector('code').textContent;await navigator.clipboard.writeText(code);btn.textContent='Copied';setTimeout(()=>btn.textContent='Copy',1400)})}
    function buildToc(){const toc=$('#toc');toc.innerHTML='';const hs=[...document.querySelectorAll('#content h2,#content h3')];if(!hs.length){toc.innerHTML='<span style="color:var(--faint);font-size:13px">Overview</span>';return}for(const h of hs){const a=document.createElement('a');a.href='javascript:void(0)';a.textContent=h.textContent;if(h.tagName==='H3')a.className='sub';a.onclick=()=>h.scrollIntoView({behavior:'smooth',block:'start'});toc.appendChild(a)}}
    function buildPager(route){const pager=$('#pager');const i=state.pages.findIndex(p=>p.path===route);const prev=state.pages[i-1],next=state.pages[i+1];pager.innerHTML=`${prev?`<a href="#${prev.path}"><span>‹</span><span><small>Previous</small><b>${esc(prev.title)}</b></span></a>`:'<span></span>'}${next?`<a class="next" href="#${next.path}"><span><small>Next</small><b>${esc(next.title)}</b></span><span>›</span></a>`:'<span></span>'}`}
    function openSearch(){renderSearch('');$('#search-layer').classList.add('open');setTimeout(()=>$('#search-input').focus(),0)}function closeSearch(){$('#search-layer').classList.remove('open');$('#search-input').value=''}function renderSearch(q){q=q.trim().toLowerCase();const results=state.pages.filter(p=>!q||(p.title+' '+p.description+' '+p.group).toLowerCase().includes(q)).slice(0,12);$('#search-results').innerHTML=results.length?results.map(p=>`<a class="search-result" href="#${p.path}"><b>${esc(p.title)}</b><span>${esc(p.group)}</span></a>`).join(''):'<div class="search-empty">No documentation found.</div>';$('#search-results').querySelectorAll('a').forEach(a=>a.onclick=closeSearch)}
    function applyTheme(theme){document.documentElement.dataset.theme=theme;localStorage.setItem('logical-theme',theme);$('#theme-label').textContent=theme==='dark'?'Dark':'Light';document.querySelector('meta[name="theme-color"]').content=theme==='dark'?'#111214':'#ffffff'}function closeMobile(){$('#sidebar').classList.remove('open');$('#overlay').classList.remove('open')}
    $('#open-search').onclick=openSearch;$('#search-input').oninput=e=>renderSearch(e.target.value);$('#search-layer').onclick=e=>{if(e.target===e.currentTarget)closeSearch()};addEventListener('keydown',e=>{if(e.key==='Escape')closeSearch();if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}});$('#theme-button').onclick=()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');$('#collapse-button').onclick=()=>$('#workspace').classList.toggle('collapsed');$('#mobile-menu').onclick=()=>{$('#sidebar').classList.add('open');$('#overlay').classList.add('open')};$('#overlay').onclick=closeMobile;
    boot().catch(()=>{$('#title').textContent='Logical Scripts';$('#description').style.display='none';$('#content').innerHTML='<p class="empty">Unable to load the documentation.</p>'});
  </script>
</body>
</html>
