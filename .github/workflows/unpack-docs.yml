name: Extract documentation

on:
  push:
    paths:
      - 'Logical-Scripts-Docs.zip'
      - '.github/workflows/unpack-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove retired documentation
        run: rm -rf chat ui

      - name: Extract documentation archive
        run: |
          if [ -f "Logical-Scripts-Docs.zip" ]; then
            rm -rf .docs-extract
            mkdir .docs-extract
            unzip -q Logical-Scripts-Docs.zip -d .docs-extract
            cp -a .docs-extract/Logical-Scripts-Docs/. .
            rm -rf .docs-extract Logical-Scripts-Docs.zip
          fi

      - name: Commit documentation changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Extract Logical Scripts documentation"
          git push
