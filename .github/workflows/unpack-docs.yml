name: Extract documentation

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/unpack-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract documentation
        run: |
          unzip -q Logical-Scripts-Docs.zip
          cp -a Logical-Scripts-Docs/. .
          rm -rf Logical-Scripts-Docs Logical-Scripts-Docs.zip

      - name: Commit documentation files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract Logical Scripts documentation"
          git push
